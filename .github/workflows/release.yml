name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and create tag
        id: version
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # バージョン種別の判定（major > minor > patch）
          VERSION_TYPE="patch"
          if echo "${PR_LABELS}" | grep -q '"major"'; then
            VERSION_TYPE="major"
          elif echo "${PR_LABELS}" | grep -q '"minor"'; then
            VERSION_TYPE="minor"
          fi
          echo "::notice::Version type: ${VERSION_TYPE}"

          # 最新タグの取得
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          if [ -z "${LATEST_TAG}" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "::notice::Previous tag: ${LATEST_TAG}"

          # バージョンのパースとバンプ
          VERSION=${LATEST_TAG#v}
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: ${LATEST_TAG} (expected vX.Y.Z)"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

          case "${VERSION_TYPE}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "::notice::New tag: ${NEW_TAG}"

          # タグの重複チェック（NFR-011）
          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${NEW_TAG} already exists. Aborting."
            exit 1
          fi

          # タグの作成とプッシュ
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          # outputs の設定
          echo "new_tag=${NEW_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version_type=${VERSION_TYPE}" >> "${GITHUB_OUTPUT}"
          echo "previous_tag=${LATEST_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
